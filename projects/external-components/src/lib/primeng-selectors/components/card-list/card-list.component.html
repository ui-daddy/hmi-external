<div class="container-fluid">
  <div class="spinner-border text-primary" role="status" *ngIf="loading">
    <span class="visually-hidden">Loading...</span>
  </div>
  <div class="row" *ngIf="!loading">
    <div class="col-lg-3 col-md-4 col-sm-4 col-xs-6 mb-3" *ngFor="let card of fieldObj.customAttributes.cardList;let i=index">
      <div class="card">
        <div class="card-body">
          <h5 class="card-title">{{card.title+ ' '+ (i+1)}} </h5>
          <img [src]="card.thumbnail" class="img-thumbnail" alt="card thumbnail">
          <div class="d-flex justify-content-center mt-3">
            <button class="btn btn-primary me-3" *ngIf="fieldObj.customAttributes.showPrimaryBtn">{{fieldObj.customAttributes.primaryBtnLabel}}</button>
            <button class="btn btn-primary ml-2" *ngIf="fieldObj.customAttributes.showSecondaryBtn">{{fieldObj.customAttributes.secondaryBtnLabel}}</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
