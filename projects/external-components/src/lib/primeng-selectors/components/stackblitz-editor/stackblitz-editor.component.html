<div *ngIf="!onIOS" class="full-height" [ngStyle]="{'display': onLoad ? 'none' : 'block'}">
    <div #editorContainer class="editor-container" style="border: none"></div>
</div>
<div class="loader full-height" *ngIf="!onIOS" [ngStyle]="{'display': onLoad ? 'flex' : 'none'}">
    <p-progressSpinner ariaLabel="loading"></p-progressSpinner>
</div>
<div class="button-actions" [ngClass]="{'ios-button': onIOS}">
    <button *ngIf="onIOS" pButton type="button" class="p-button p-button-sm theme" (click)="openInNewTab()" 
    tooltipPosition="top" pTooltip="Open the preview in a new tab">Open Preview in New Tab</button>
    <button pButton type="button" class="p-button p-button-sm theme" 
    (click)="saveCode()" tooltipPosition="top" pTooltip="Save/update code to the GitHub repository"
    [ngClass]="{'ios-button': onIOS}">Build App</button>
    <!-- <button pButton type="button" class="p-button p-button-sm theme p-button-secondary" (click)="cancel()">Cancel</button> -->
</div>
