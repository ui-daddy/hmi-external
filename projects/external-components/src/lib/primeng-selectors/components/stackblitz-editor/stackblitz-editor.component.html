<div class="full-height" [ngStyle]="{'display': onLoad ? 'none' : 'block'}"><div #editorContainer class="editor-container" style="border: none"></div></div>
<div class="loader full-height" [ngStyle]="{'display': onLoad ? 'flex' : 'none'}">
    <p-progressSpinner ariaLabel="loading"></p-progressSpinner>
</div>
<div class="button-actions">
    <button pButton type="button" [disabled]="isBuildAppDisabled" class="p-button p-button-sm theme" (click)="saveCode()" tooltipPosition="top" pTooltip="Save/update code to the GitHub repository">
        <span *ngIf="isBuildAppDisabled" class="spinner-border spinner-border-sm" role="status"></span>
        Build App
    </button>
    <button  *ngIf="buildStatus === 'COMPLETED' || buildStatus === 'FAILED'" pButton type="button" class="p-button p-button-sm theme" (click)="loadLog()">Logs</button>
    <!-- <button pButton type="button" class="p-button p-button-sm theme p-button-secondary" (click)="cancel()">Cancel</button> -->
</div>
<p-dialog header="Build Log" [(visible)]="showModal" [modal]="true" [style]="{width: '70vw'}">
    <ng-container *ngIf="buildLog; else loading">
        <pre class="log-container">{{ buildLog }}</pre>
    </ng-container>
    <ng-template #loading>
        <p>Loading...</p>
    </ng-template>
</p-dialog>
<p-dialog header=" Build completed" [(visible)]="buildStatusCompleted" [modal]="true"   [style]="{ background: '#d1e7dd', border: '1px solid #a3cfbb', width: '95vw' }" >
    <ng-container *ngIf="previewLink; else loading">
        Click following link to preview
        <a href={{previewLink}} target="_blank" rel="noopener noreferrer">{{previewLink}}</a>
    </ng-container>
    <ng-template #loading>
        <p>Loading...</p>
    </ng-template>
</p-dialog>
