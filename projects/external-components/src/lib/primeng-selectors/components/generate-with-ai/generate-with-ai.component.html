<div class="chat-container">
  <div class="flex-grow-1 w-100 code-preview-container" *ngIf="previewCode">
    <hmi-ext-stackblitz-editor [code]="previewCode" [dependencies]="previewDependencies"></hmi-ext-stackblitz-editor>
  </div>
  <div class="messages" #messagesContainer>
    <div *ngFor="let message of filteredMessages; let messageIndex = index;" [ngClass]="{'user-message': message.isUser, 'bot-message flex-grow-1 w-100': !message.isUser}">
      <ng-container *ngFor="let part of message.parts;">
        <div *ngIf="part.type === 'text'" class="message-text">{{ part.content }}</div>

                <i class="pi" [ngClass]="showCopiedLabel ? 'pi-check' : 'pi-copy'"></i>
                {{showCopiedLabel ? 'Copied' : 'Copy Code'}}
              </div>
              <div class="code-import-button" (click)="createComponent(part.content, messageIndex)" pTooltip="Save/update code to the GitHub repository" tooltipPosition="top">
                <i class="pi pi-plus"></i>
                Save
              </div>
              <div class="code-import-button" (click)="preview(part.content, messageIndex)" pTooltip="Preview code on StackBlitz" tooltipPosition="top">
                <i class="pi pi-eye"></i>

              </div>
            </div>
          </div>

        <!-- <hmi-ext-stackblitz-editor *ngIf="part.type === 'code' && part.language === 'typescript'" [code]="getValue(messageIndex, 'typescript')" [dependencies]="getValue(messageIndex, 'json')"></hmi-ext-stackblitz-editor> -->
      </ng-container>
    </div>
    
  </div>
  <div class="input-container">
    <input [(ngModel)]="fieldObj.value.newMessage" placeholder="Type your message" (keyup.enter)="sendMessage()" />
    <button pButton type="button" class="p-button p-button-sm theme" (click)="sendMessage()">Send</button>
  </div>
</div>
