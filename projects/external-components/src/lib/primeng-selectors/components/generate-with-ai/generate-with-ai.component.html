<div class="chat-container">
  <div class="flex-grow-1 w-100 code-preview-container" *ngIf="previewCode">
    <hmi-ext-stackblitz-editor [code]="previewCode" [dependencies]="previewDependencies" [isDialog]="false"
    (codeChange)="onCodeChange($event)"></hmi-ext-stackblitz-editor>
  </div>

        <div class="bot-message message-text flex-grow-1 w-100">
          <div>Hi! What do you want to build today?</div> 
          <div *ngIf="isTypingActive" class="dynamic-suggestion">{{displayedText}}</div>
        </div>    
    </div>

    <div *ngFor="let message of filteredMessages; let messageIndex = index;" [ngClass]="{'user-message': message.isUser, 'bot-message flex-grow-1 w-100': !message.isUser}">
      <ng-container *ngFor="let part of message.parts;">
        <div *ngIf="part.type === 'text'" class="message-text">{{ part.content }}</div>

              </div>
            </div>
          </div>
          <pre class="message-code" ><code>{{ part.content }}</code></pre>

      </ng-container>
    </div>
    
  </div>
